name: Generate Yandex SpeechKit voice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Russian word audio with Yandex SpeechKit
        env:
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${YC_API_KEY:-}" ]; then
            echo "Missing repository secret YC_API_KEY"
            exit 1
          fi

          mkdir -p audio

          tts () {
            word="$1"
            file="$2"
            echo "Generating $word -> $file"
            curl --fail --silent --show-error               --request POST               --header "Authorization: Api-Key ${YC_API_KEY}"               --data-urlencode "text=${word}"               --data "lang=ru-RU&voice=alena&emotion=good&speed=0.90"               "https://tts.api.cloud.yandex.net/speech/v1/tts:synthesize"               --output "audio/${file}.ogg"
          }

          tts "яблоко" apple
          tts "банан" banana
          tts "груша" pear
          tts "апельсин" orange
          tts "кот" cat
          tts "собака" dog
          tts "заяц" hare
          tts "медведь" bear
          tts "машина" car
          tts "автобус" bus
          tts "поезд" train
          tts "самолёт" plane
          tts "хлеб" bread
          tts "сыр" cheese
          tts "яйцо" egg
          tts "морковь" carrot
          tts "солнце" sun
          tts "облако" cloud
          tts "дерево" tree
          tts "цветок" flower
          tts "футболка" tshirt
          tts "брюки" trousers
          tts "носки" socks
          tts "ботинки" shoes
          tts "кровать" bed
          tts "стул" chair
          tts "дверь" door
          tts "лампа" lamp
          tts "глаз" eye
          tts "ухо" ear
          tts "нос" nose
          tts "рука" hand
          tts "мишка" teddy
          tts "мяч" ball
          tts "шарик" balloon
          tts "барабан" drum

      - name: Commit generated audio
        run: |
          git config user.name "speech-games-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && exit 0
          git commit -m "Add Yandex SpeechKit word audio"
          git push
